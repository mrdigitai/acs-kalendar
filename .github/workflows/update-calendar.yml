name: Update Sparta ICS calendar

on:
  schedule:
    # Pondeli a ctvrtek 6:00 UTC (~8:00 CEST). Uprav si dle chuti -- je to zdarma
    # i pri castejsim behu, GitHub Actions ma 2000 min/mesic zdarma na osobni ucet.
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}  # rucni spusteni z GitHub UI, hodi se na testovani

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate sparta.ics
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SPARTA_TEAM_ID: ${{ secrets.SPARTA_TEAM_ID }}
          SEASON: "2026"
        run: python main.py

      - name: Commit if changed
        run: |
          git config user.name "acs-kalendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sparta.ics
          git diff --staged --quiet || git commit -m "Auto-update sparta.ics [skip ci]"
          git push
